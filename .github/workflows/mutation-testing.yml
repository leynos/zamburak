name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-cargo-workflow.md.
# Scheduled runs mutate only files changed within the detection window;
# manual dispatch runs mutate everything, fanned out across shards. To
# test a branch, select it in the Actions "Run workflow" control.

on:
  schedule:
    - cron: "20 5 * * *" # Daily, 05:20 UTC
  workflow_dispatch:

# Default the token to no scopes; the job opts in explicitly.
permissions: {}

# Serialize runs per ref: a dispatch during a scheduled run (or vice
# versa) queues rather than racing. Runs are informational, so queued
# runs wait instead of cancelling.
concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@927edd45ae77be4251a8a18ca9eb5613a2e32cbd
    with:
      # The root crate lives in src/ and the workspace members under
      # crates/; the vendored third_party/full-monty fork is excluded
      # from the workspace and stays out of scope.
      paths: "src/,crates/,examples/,benches/"
      # crates/test-utils is a test-fixture crate; its survivors are
      # noise. In-source *_tests.rs / test_helpers.rs modules are all
      # #[cfg(test)]-gated, so cargo-mutants skips them already.
      exclude-globs: "crates/test-utils/**"
      # Match the CI baseline (`make test` runs --all-targets
      # --all-features) so feature-gated tests run against mutants, and
      # test the whole workspace against each mutant: cargo-mutants runs
      # only the mutated package's tests by default, so workspace crates
      # covered by dependent crates' tests would report false survivors.
      extra-args: "--all-features --test-workspace=true"
