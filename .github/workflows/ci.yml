name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN || '' }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 || '' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@29eea2635ee0f92e42c05f4cd360b7f1a2f00b12
      - name: Monty fork review policy
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          base_rev="${{ github.event.pull_request.base.sha }}"
          head_rev="${{ github.event.pull_request.head.sha }}"
          submodule_path="third_party/full-monty"

          if ! git rev-parse --verify "${base_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at base revision ${base_rev}."
            exit 0
          fi

          if ! git rev-parse --verify "${head_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at head revision ${head_rev}."
            exit 0
          fi

          cargo run --bin monty_fork_review -- \
            --base-superproject-rev "${base_rev}" \
            --head-superproject-rev "${head_rev}"
      - name: Monty fork review policy (manual trigger)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          base_rev="HEAD~1"
          head_rev="HEAD"
          submodule_path="third_party/full-monty"

          if ! git rev-parse --verify "${base_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at base revision ${base_rev}."
            exit 0
          fi

          if ! git rev-parse --verify "${head_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at head revision ${head_rev}."
            exit 0
          fi

          cargo run --bin monty_fork_review -- \
            --base-superproject-rev "${base_rev}" \
            --head-superproject-rev "${head_rev}"
      - name: Setup uv
        run: |
          python3 -m pip install --user uv==0.10.2
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25
        with:
          globs: |
            **/*.md
            !**/target/**
            !**/dist/**
      - name: Script baseline
        run: make script-baseline
      - name: Script tests
        run: make script-test
      - name: Lint
        run: make lint
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@927edd45ae77be4251a8a18ca9eb5613a2e32cbd
        with:
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
      # The `mode: check` step is deliberately not wired in yet: this
      # repository's CodeScene project (76771) has not been confirmed
      # to carry a coverage-gates configuration, and every other
      # project surveyed during this rollout (ddlint 69278, chutoro
      # 71838) lacked one, failing `cs-coverage check` unconditionally
      # with "HTTP call succeeded, but the received project-config
      # isn't valid. Lacks the gates configuration." — a CodeScene-side
      # per-project setting, not a CI defect. Add the check step in a
      # fast-follow PR once coverage-main.yml has uploaded to main at
      # least once and the gate is confirmed to resolve, or once
      # CodeScene confirms the project's coverage gate is enabled.

  phase-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@29eea2635ee0f92e42c05f4cd360b7f1a2f00b12
      - name: Evaluate phase-gate suites
        run: make phase-gate
