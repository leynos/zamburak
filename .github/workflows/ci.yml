name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@cfcc379e29be516160f499864ae82720842359af
        with:
          expect-cache: any
      - name: Monty fork review policy
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          base_rev="${{ github.event.pull_request.base.sha }}"
          head_rev="${{ github.event.pull_request.head.sha }}"
          submodule_path="third_party/full-monty"

          if ! git rev-parse --verify "${base_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at base revision ${base_rev}."
            exit 0
          fi

          if ! git rev-parse --verify "${head_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at head revision ${head_rev}."
            exit 0
          fi

          cargo run --bin monty_fork_review -- \
            --base-superproject-rev "${base_rev}" \
            --head-superproject-rev "${head_rev}"
      - name: Monty fork review policy (manual trigger)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          base_rev="HEAD~1"
          head_rev="HEAD"
          submodule_path="third_party/full-monty"

          if ! git rev-parse --verify "${base_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at base revision ${base_rev}."
            exit 0
          fi

          if ! git rev-parse --verify "${head_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at head revision ${head_rev}."
            exit 0
          fi

          cargo run --bin monty_fork_review -- \
            --base-superproject-rev "${base_rev}" \
            --head-superproject-rev "${head_rev}"
      - name: Setup uv
        run: |
          python3 -m pip install --user uv==0.10.2
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Enforce en-GB-oxendict spelling
        run: make spelling
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@cfcc379e29be516160f499864ae82720842359af
        with:
          version: "0.6.1"
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Script baseline
        run: make script-baseline
      - name: Script tests
        run: make script-test
      - name: Install the Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@cfcc379e29be516160f499864ae82720842359af
      - name: Lint
        run: make lint
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@cfcc379e29be516160f499864ae82720842359af
        with:
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
          # Pull requests ratchet against the baseline coverage-main.yml
          # writes on main and never contact CodeScene; that workflow is the
          # one publisher. tests/workflow_contracts holds the shape.
          publish-artefact: 'false'
      - name: Set up Rust for Merman
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: '1.95.0'
      - name: Install Mermaid validation tools
        run: |
          uv tool install nixie-cli==1.1.0
          cargo +1.95.0 install merman-cli --version '=0.7.0' --locked
      - name: Validate Mermaid diagrams
        run: make nixie
  phase-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@cfcc379e29be516160f499864ae82720842359af
        with:
          expect-cache: any
      - name: Evaluate phase-gate suites
        run: make phase-gate
