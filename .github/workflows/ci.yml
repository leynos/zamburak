name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_INSTALLER_VERSION: '0.2.6'
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN || '' }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@18bed1ca49a6de3d8882bd72635a32ae3f023d57
      - name: Monty fork review policy
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          base_rev="${{ github.event.pull_request.base.sha }}"
          head_rev="${{ github.event.pull_request.head.sha }}"
          submodule_path="third_party/full-monty"

          if ! git rev-parse --verify "${base_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at base revision ${base_rev}."
            exit 0
          fi

          if ! git rev-parse --verify "${head_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at head revision ${head_rev}."
            exit 0
          fi

          cargo run --bin monty_fork_review -- \
            --base-superproject-rev "${base_rev}" \
            --head-superproject-rev "${head_rev}"
      - name: Monty fork review policy (manual trigger)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          base_rev="HEAD~1"
          head_rev="HEAD"
          submodule_path="third_party/full-monty"

          if ! git rev-parse --verify "${base_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at base revision ${base_rev}."
            exit 0
          fi

          if ! git rev-parse --verify "${head_rev}:${submodule_path}" >/dev/null 2>&1; then
            echo "Skipping monty_fork_review: ${submodule_path} is not present at head revision ${head_rev}."
            exit 0
          fi

          cargo run --bin monty_fork_review -- \
            --base-superproject-rev "${base_rev}" \
            --head-superproject-rev "${head_rev}"
      - name: Setup uv
        run: |
          python3 -m pip install --user uv==0.10.2
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Enforce en-GB-oxendict spelling
        run: make spelling
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25
        with:
          globs: |
            **/*.md
            !**/target/**
            !**/dist/**
            !**/.uv-cache/**
            !**/.uv-tools/**
      - name: Script baseline
        run: make script-baseline
      - name: Script tests
        run: make script-test
      - name: Cache Whitaker installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install the Whitaker Dylint suite
        run: |
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          whitaker-installer
      - name: Lint
        run: make lint
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@18bed1ca49a6de3d8882bd72635a32ae3f023d57
        with:
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: github.event_name == 'pull_request' && env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@18bed1ca49a6de3d8882bd72635a32ae3f023d57
        with:
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/76771
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
      - name: Set up Rust for Merman
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master
        with:
          toolchain: '1.95.0'
      - name: Install Mermaid validation tools
        run: |
          uv tool install nixie-cli==1.1.0
          cargo +1.95.0 install merman-cli --version '=0.7.0' --locked
      - name: Validate Mermaid diagrams
        run: make nixie
  phase-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@18bed1ca49a6de3d8882bd72635a32ae3f023d57
      - name: Evaluate phase-gate suites
        run: make phase-gate
